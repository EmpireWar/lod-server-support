import org.spongepowered.gradle.plugin.config.PluginLoaders
import org.spongepowered.gradle.vanilla.repository.MinecraftPlatform
import org.spongepowered.plugin.metadata.model.PluginDependency

plugins {
    id 'java'
    id 'org.spongepowered.gradle.plugin' version '2.3.1-SNAPSHOT'
    id 'org.spongepowered.gradle.vanilla' version '0.2.2'
    id 'com.gradleup.shadow' version '9.4.2'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

minecraft {
    version(project.minecraft_version)
    platform(MinecraftPlatform.SERVER)
    accessWideners(file('src/main/resources/lss-sponge.accesswidener'))
}

// The xplat shared source set, as the fabric/neoforge modules compile it — server half only:
// this is a dedicated-server plugin, so the client tree and client-only mixins stay out.
sourceSets {
    main {
        java {
            srcDir '../xplat/src/main/java'
            exclude 'dev/vox/lss/networking/client/**'
            exclude 'dev/vox/lss/config/menu/**'
            exclude 'dev/vox/lss/config/LSSClientConfig.java'
            exclude 'dev/vox/lss/api/**'
            exclude 'dev/vox/lss/compat/Xaero*'
            exclude 'dev/vox/lss/compat/VoxyCompat.java'
            exclude 'dev/vox/lss/compat/ModCompat.java'
            exclude 'dev/vox/lss/compat/VoxyStorageOverride.java'
            exclude 'dev/vox/lss/seed/ClientWorldSeed.java'
            exclude 'dev/vox/lss/mixin/AccessorClientPacketListener.java'
            exclude 'dev/vox/lss/mixin/AccessorEntityRenderDispatcher.java'
            exclude 'dev/vox/lss/mixin/AccessorLivingEntity.java'
            exclude 'dev/vox/lss/mixin/AccessorBiomeManager.java'
            exclude 'dev/vox/lss/benchmark/**'
        }
    }
}

sponge {
    apiVersion('18.0.0-SNAPSHOT')
    license('MIT')
    loader {
        name(PluginLoaders.JAVA_PLAIN)
        version('1.0')
    }
    plugin('lodserversupport') {
        displayName('LOD Server Support')
        entrypoint('dev.vox.lss.sponge.LSSSpongePlugin')
        description('Voxy multiplayer support (unofficial). Enables players with Voxy to see fully rendered terrain out to hundreds of chunks on multiplayer servers without needing to explore the world first.')
        links {
            homepage('https://modrinth.com/plugin/lod-server-support')
            source('https://github.com/VoX/lod-server-support')
        }
        contributor('VoX') {
            description('Author')
        }
        dependency('spongeapi') {
            loadOrder(PluginDependency.LoadOrder.AFTER)
            optional(false)
        }
    }
}

dependencies {
    implementation project(':common')
    // zstd remains unrelocated and native-stripped, as on Paper. Common carries SQLite as
    // an opaque capsule loaded privately.
    implementation 'com.github.luben:zstd-jni:1.5.7-3'
    compileOnly 'org.spongepowered:mixin:0.8.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

// Native strip lists â€” keep in sync with paper/build.gradle.
def storeNativeKeep = [
    'linux/amd64/', 'linux/aarch64/', 'win/amd64/', 'win/aarch64/',
    'darwin/x86_64/', 'darwin/aarch64/',
]
def storeNativeRoots = ['linux/', 'win/', 'darwin/', 'freebsd/', 'aix/']
def storeNativeStrip = { el ->
    def p = el.relativePath.pathString
    storeNativeRoots.any { p.startsWith(it) } && !storeNativeKeep.any { p.startsWith(it) }
}

jar {
    manifest.attributes('Access-Widener': 'lss-sponge.accesswidener', 'MixinConfigs': 'lss.sponge.mixins.json')
}

shadowJar {
    archiveBaseName = 'lod-server-support-sponge'
    archiveClassifier = ''
    archiveVersion = providers.environmentVariable('CI').map { it == 'true' }.getOrElse(false)
            ? "${project.mod_version}+${project.minecraft_version}" : ''
    configurations = [project.configurations.runtimeClasspath]
    // Sponge provides slf4j, fastutil and gson.
    exclude 'org/slf4j/**'
    exclude 'META-INF/maven/org.slf4j/**'
    exclude storeNativeStrip
    from(rootProject.file("LICENSE")) {
        rename { "${it}_lod-server-support-sponge" }
    }
    from(rootProject.file("THIRD-PARTY-NOTICES"))
}

tasks.named('assemble') { dependsOn tasks.named('shadowJar') }

// ---- Voxy Server Side branding (the Paper twin's vssJar, Sponge metadata) ----
// A byte-copy rebrand of the shadow jar: the plugin id/name in sponge_plugins.json and
// lss-brand.properties (which also renames the command to /vsslod and its permission to
// vss.admin). Wire-identical to the LSS jar.
import java.util.zip.ZipFile
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

def vssSpongeVersion = providers.environmentVariable('CI').map { it == 'true' }.getOrElse(false)
        ? "${project.mod_version}+${project.minecraft_version}" : ''
def vssSpongeJarName = "voxy-server-side-sponge" + (vssSpongeVersion ? "-${vssSpongeVersion}" : "") + ".jar"

tasks.register('vssJar') {
    description = 'Repackages the LSS Sponge jar under the Voxy Server Side branding.'
    dependsOn tasks.named('shadowJar')
    def srcJar = tasks.named('shadowJar').flatMap { it.archiveFile }
    def outFile = layout.buildDirectory.file("libs/${vssSpongeJarName}")
    inputs.file(srcJar)
    outputs.file(outFile)
    doLast {
        def src = srcJar.get().asFile
        def out = outFile.get().asFile
        out.parentFile.mkdirs()
        def zf = new ZipFile(src)
        try {
            new ZipOutputStream(new FileOutputStream(out)).withCloseable { zos ->
                def entries = zf.entries()
                while (entries.hasMoreElements()) {
                    def e = entries.nextElement()
                    byte[] replaced = null
                    if (e.name == 'META-INF/sponge_plugins.json') {
                        def text = zf.getInputStream(e).getText('UTF-8')
                        def rebranded = text
                                .replace('"id": "lodserversupport"', '"id": "voxyserverside"')
                                .replace('"name": "LOD Server Support"', '"name": "Voxy Server Side"')
                                .replace('"homepage": "https://modrinth.com/plugin/lod-server-support"',
                                        '"homepage": "https://modrinth.com/plugin/voxy-server-side"')
                        if (rebranded == text || !rebranded.contains('"id": "voxyserverside"')) {
                            throw new GradleException('vssJar: sponge_plugins.json shape changed; update the rebrand')
                        }
                        replaced = rebranded.getBytes('UTF-8')
                    } else if (e.name == 'lss-brand.properties') {
                        replaced = 'shortName=VSS\ndisplayName=Voxy Server Side\nclientCommand=vss\nserverCommand=vsslod\n'
                                .getBytes('UTF-8')
                    }
                    def ne = new ZipEntry(e.name)
                    if (replaced != null) {
                        zos.putNextEntry(ne)
                        zos.write(replaced)
                    } else {
                        ne.method = e.method
                        if (e.method == ZipEntry.STORED) {
                            ne.size = e.size
                            ne.compressedSize = e.compressedSize
                            ne.crc = e.crc
                        }
                        zos.putNextEntry(ne)
                        zf.getInputStream(e).withCloseable { is -> zos << is }
                    }
                    zos.closeEntry()
                }
            }
        } finally {
            zf.close()
        }
    }
}

tasks.named('shadowJar') { finalizedBy tasks.named('vssJar') }
